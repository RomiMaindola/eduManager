<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mark Attendance</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #eef2f7; }
        .sidebar { width: 240px; height: 100vh; background: linear-gradient(180deg,#1e3c72,#2a5298); color: white; position: fixed; padding-top: 20px; display: flex; flex-direction: column; }
        .sidebar h2 { text-align: center; margin-bottom: 30px; font-size: 1.1rem; }
        .sidebar a { display: flex; align-items: center; gap: 10px; padding: 13px 20px; color: white; text-decoration: none; font-size: 0.95rem; transition: background 0.2s; }
        .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,0.15); border-left: 3px solid #fff; }
        .sidebar .logout-btn { margin-top: auto; background: rgba(255,0,0,0.2); }
        .main { margin-left: 240px; padding: 25px; }
        .page-title { font-size: 1.6rem; font-weight: bold; color: #1e3c72; margin-bottom: 5px; }
        .page-sub { color: #777; margin-bottom: 20px; }
        .card { background: white; border-radius: 14px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .card h3 { margin-top: 0; color: #1e3c72; border-bottom: 2px solid #eef2f7; padding-bottom: 10px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-weight: 600; color: #555; font-size: 0.9rem; }
        .form-group input, .form-group select { padding: 10px 14px; border: 1.5px solid #dde1e7; border-radius: 8px; font-size: 0.95rem; outline: none; }
        .form-group input:focus, .form-group select:focus { border-color: #1e3c72; }
        .btn-primary { background: linear-gradient(135deg,#1e3c72,#2a5298); color: white; padding: 10px 24px; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #1e3c72; color: white; padding: 12px; text-align: left; font-size: 0.9rem; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        tr:hover td { background: #f8f9fb; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .badge-present { background: #d4edda; color: #155724; }
        .badge-absent { background: #f8d7da; color: #721c24; }
        select.att-select { border: none; background: transparent; font-weight: bold; cursor: pointer; }
        .btn-save { background: #27ae60; color: white; padding: 10px 24px; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: bold; cursor: pointer; margin-top: 12px; }
    </style>
</head>
<body>
<div class="sidebar">
    <h2>👨‍🏫 EduManager Staff</h2>
    <a href="/staff/dashboard">🏠 Dashboard</a>
    <a href="/staff/attendance" class="active">📋 Attendance</a>
    <a href="/staff/notes">📚 Upload Notes</a>
    <a href="/staff/result">📊 Results</a>
    <a href="/staff/announcement">📢 Announcements</a>
    <a href="/staff/leave">🗓️ Leave</a>
    <a href="/staff/generate-exam">🧠 Generate Exam</a>
    <a href="/staff/logout" class="logout-btn">🚪 Logout</a>
</div>
<div class="main">
    <div class="page-title">📋 Mark Attendance</div>
    <div class="page-sub">Record and manage student attendance for your class.</div>

    <div class="card">
        <h3>Filter / Select Class</h3>
        <div class="form-row">
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="attDate">
            </div>
            <div class="form-group">
                <label>Subject</label>
                <select id="attSubject">
                    <option>Data Structures</option>
                    <option>Operating Systems</option>
                    <option>DBMS</option>
                    <option>Computer Networks</option>
                </select>
            </div>
            <div class="form-group">
                <label>Semester</label>
                <select>
                    <option>5th Semester</option>
                    <option>3rd Semester</option>
                    <option>7th Semester</option>
                </select>
            </div>
        </div>
        <button class="btn-primary" onclick="loadStudents()">Load Students</button>
    </div>

    <div class="card" id="attendanceTable" style="display:none;">
        <h3>📋 Student Attendance List</h3>
        <table id="stuTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Admission No</th>
                    <th>Student Name</th>
                    <th>Attendance</th>
                </tr>
            </thead>
            <tbody id="stuBody"></tbody>
        </table>
        <button class="btn-save" onclick="saveAttendance()">💾 Save Attendance</button>
    </div>
</div>
<script>
document.getElementById('attDate').value = new Date().toISOString().split('T')[0];
const students = [
    {no:'ADM001',name:'Aakash Sharma'},{no:'ADM002',name:'Priya Verma'},{no:'ADM003',name:'Rahul Gupta'},
    {no:'ADM004',name:'Sneha Patel'},{no:'ADM005',name:'Mohan Das'},{no:'ADM006',name:'Kavya Nair'}
];
function loadStudents() {
    const tbody = document.getElementById('stuBody');
    tbody.innerHTML = '';
    students.forEach((s,i) => {
        tbody.innerHTML += `<tr>
            <td>${i+1}</td><td>${s.no}</td><td>${s.name}</td>
            <td><select class="att-select" id="att_${s.no}">
                <option value="P" style="color:green">✅ Present</option>
                <option value="A" style="color:red">❌ Absent</option>
            </select></td>
        </tr>`;
    });
    document.getElementById('attendanceTable').style.display='block';
}
function saveAttendance() { alert('✅ Attendance saved successfully!'); }
</script>
</body>
</html>
